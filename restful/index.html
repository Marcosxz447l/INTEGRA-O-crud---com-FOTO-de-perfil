<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>iNTEGRAÇÃO crud - com FOTO de perfil</title>
  </head>
  <style>

  </style>
  <body>
     <div class="container">
       <h1>Gerenciamento de usuarios</h1>
       <form class="userForm" enctype="multipart/form-data">
         <input type="hidden" id="userId" name="id">

         <div class="form-group">
           <label for="nome">Nome Completo</label>
           <input type="text" id="nome" name="nome" required placeholder="Ex: Maria Silva">
         </div>
         <div class="form-group">
           <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="Ex: maria@gmail.com">
         </div>
         <div class="form-group">
           <label for="foto">Foto de perfil</label>
           <input type="file" id="foto" name="foto" accept="image/*">

         </div>

       </form>
     </div>
  </body>
</html>
